<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#bb86fc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#9d4edd;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Stethoscope earpiece -->
    <circle cx="70" cy="50" r="8" fill="url(#grad2)"/>
    <circle cx="130" cy="50" r="8" fill="url(#grad2)"/>

    <!-- Stethoscope tubes -->
    <path d="M 70 58 Q 70 80 100 90" stroke="url(#grad2)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 130 58 Q 130 80 100 90" stroke="url(#grad2)" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Stethoscope chest piece - circle with pulse -->
    <circle cx="100" cy="130" r="25" fill="none" stroke="url(#grad2)" stroke-width="3.5"/>
    <circle cx="100" cy="130" r="18" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
    <circle cx="100" cy="130" r="10" fill="url(#grad2)" opacity="0.4"/>
</svg>