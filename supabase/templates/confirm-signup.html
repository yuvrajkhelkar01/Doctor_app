<!-- Supabase → Authentication → Emails → "Confirm signup"
     Subject: Confirm account creation -->
<div style="margin:0;padding:32px 16px;background:#F3F1FE;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#FFFFFF;border-radius:16px;padding:32px 28px;text-align:center;">
    <h1 style="margin:0 0 12px;font-size:22px;color:#1B1A33;">Confirm account creation</h1>
    <p style="margin:0 0 8px;font-size:15px;line-height:1.5;color:#6B6A85;">
      Hi {{ .Data.first_name }}, someone signed up for a Clinic Care doctor account with
      <strong style="color:#1B1A33;">{{ .Email }}</strong>.
    </p>
    <p style="margin:0 0 28px;font-size:15px;line-height:1.5;color:#6B6A85;">
      Was this you?
    </p>

    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&action=confirm"
       style="display:block;margin:0 0 12px;padding:14px 20px;background:#6F63D6;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:15px;border-radius:12px;">
      Confirm
    </a>
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&action=cancel"
       style="display:block;padding:14px 20px;background:#FFFFFF;color:#6F63D6;text-decoration:none;font-weight:600;font-size:15px;border-radius:12px;border:1px solid #DEDAF7;">
      Cancel
    </a>

    <p style="margin:28px 0 0;font-size:12px;line-height:1.5;color:#A3A1B8;">
      If you didn't sign up, tap Cancel and the account and its details will be deleted.
    </p>
  </div>
</div>
